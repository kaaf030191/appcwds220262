<div class="layout-container">
	<header class="layout-topbar">

		<!-- Logo -->
		<div class="topbar-left">
			<span class="app-logo">EPIIS</span>
		</div>

		<!-- Menú principal -->
		<nav class="topbar-menu">
			@for(value of visibleMenuOptions; track value.route) {
				<a [routerLink]="value.route" [ngClass]="{
					'active-menu': value.active
				}">
					<i class="pi pi-{{value.icon}}"></i>
					<span>{{value.text}}</span>
				</a>
			}
		</nav>

		<!-- Opciones usuario -->
		<div class="topbar-right">
			@if(authUser()) {
				<p-button
					icon="pi pi-bell"
					[text]="true"
					severity="contrast"
					badge="2"
					badgeSeverity="danger" />

				<div class="user-profile" (click)="menu.toggle($event)">
					<p-avatar
						image="https://primefaces.org/cdn/primeng/images/demo/avatar/amyelsner.png"
						shape="circle" />

					<span class="username">{{authUser()?.firstName}}</span>
					<i class="pi pi-angle-down"></i>
				</div>

				<p-menu
					#menu
					[model]="profileItems"
					[popup]="true" />
			} @else {
				<a routerLink="/user/login" class="auth-link-topbar">Ingresar</a>
				<a routerLink="/user/register" class="auth-link-topbar auth-link-register">Registrarse</a>
			}
		</div>
	</header>

	<div class="layout-body">
		<main class="layout-main">
			<div class="content-wrapper">
				<router-outlet />
			</div>
		</main>
	</div>
</div>
